name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential libltdl-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33"

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython==0.29.36

      - name: Build APK with Buildozer
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: southern-menu-apk
          path: bin/*.apk
